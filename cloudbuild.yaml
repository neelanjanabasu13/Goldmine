steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/goldmine:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/goldmine:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - arbiter13-git
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/goldmine:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --quiet
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/goldmine:$COMMIT_SHA
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
